<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔒 Dev — Amigo Despachante</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0d0d0d;color:#e8e8e8;font-family:'Segoe UI',sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center}
  .box{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;
       padding:40px 36px;width:100%;max-width:360px;text-align:center}
  .lock{font-size:48px;margin-bottom:16px}
  h1{font-size:18px;font-weight:900;color:#f5a623;margin-bottom:4px}
  p{font-size:13px;color:#555;margin-bottom:28px}
  input[type=password]{width:100%;background:#111;border:1px solid #333;
       border-radius:8px;color:#e8e8e8;padding:12px 14px;font-size:14px;
       font-family:inherit;outline:none;margin-bottom:12px;text-align:center;
       letter-spacing:4px}
  input[type=password]:focus{border-color:#f5a623}
  button{width:100%;padding:12px;background:#f5a623;border:none;border-radius:8px;
       color:#000;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
  button:hover{opacity:.9}
  .erro{margin-top:14px;font-size:13px;color:#e74c3c}
</style>
</head>
<body>
<div class="box">
  <div class="lock">🔒</div>
  <h1>Área Restrita</h1>
  <p>Página privada de desenvolvimento</p>
  <form method="POST" action="/dev">
    <input type="password" name="senha" placeholder="••••••••••••" autofocus>
    <button type="submit">Entrar</button>
  </form>
  {% if erro %}
  <p class="erro">⚠️ Senha incorreta. Tente novamente.</p>
  {% endif %}
</div>
</body>
</html>
